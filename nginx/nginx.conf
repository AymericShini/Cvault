limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 11m;

    # SSE streaming — no buffering, before /api/ for longest-prefix match
    location /api/stream/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        add_header         X-Accel-Buffering no;
    }

    # Upload — 5 req/min per IP, burst of 2
    location = /api/upload {
        limit_req        zone=upload_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All other API routes
    location /api/ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend — catch-all
    location / {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_http_version 1.1;
    }
}
