services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DB_PATH: /app/data/cvault.db
      CHROMA_DIR: /app/data/chroma_db
    volumes:
      - cvault_data:/app/data
    networks:
      - cvault_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    networks:
      - cvault_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cvault_net
    restart: unless-stopped

volumes:
  cvault_data:

networks:
  cvault_net:
    driver: bridge
